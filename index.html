<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Clash 订阅处理（无CORS）</title>
<style>
  body{max-width:700px;margin:30px auto;padding:0 20px;font-family:system-ui}
  .card{background:#f6f8fa;padding:20px;border-radius:12px;margin-bottom:20px}
  input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:8px}
  button{background:#0071e3;color:white;border:none;padding:12px 20px;border-radius:8px;margin-top:12px;cursor:pointer}
  .result{margin-top:16px;padding:12px;background:white;border-radius:8px;word-break:break-all;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h3>Clash 订阅清理（删除含「官网」节点）</h3>
  <input type="text" id="subUrl" placeholder="输入原始订阅地址">
  <button onclick="build()">生成可用订阅链接</button>
  <div id="result" class="result" style="display:none"></div>
</div>

<script>
// ==============================
// 接口模式：返回 Base64（无CORS）
// ==============================
(async () => {
  const params = new URLSearchParams(location.search)
  const api = params.get('api')
  const url = params.get('url')

  if (!api || !url) return

  try {
    // ✅ 走公共 CORS 代理，绝对不跨域
    const proxy = 'https://api.allorigins.win/get?url=' + encodeURIComponent(url)
    const res = await fetch(proxy, {
      headers: { 'User-Agent': 'Clash.Meta' }
    })
    const json = await res.json()
    let yaml = json.contents

    // ======================
    // 删除所有含「官网」的节点 & 引用
    // ======================
    const lines = yaml.split('\n')
    const out = []
    const KEY = '官网'
    let inProxies = false, inGroup = false, skip = false

    for (const line of lines) {
      const trim = line.trim()
      if (trim === 'proxies:') { inProxies = true; inGroup = false }
      if (trim === 'proxy-groups:') { inGroup = true; inProxies = false }
      if (trim !== '' && !line.startsWith(' ') && !trim.startsWith('-')) {
        inProxies = inGroup = skip = false
      }
      // 跳过含官网的代理节点
      if (inProxies) {
        if (trim.startsWith('-')) skip = false
        if (line.includes(KEY) && /^\s*name:/.test(line)) skip = true
        if (skip) continue
      }
      // 跳过分组里的官网引用
      if (inGroup && line.includes(KEY) && trim.startsWith('-')) continue
      out.push(line)
    }

    // 转 Base64
    const finalYaml = out.join('\n')
    const base64 = btoa(unescape(encodeURIComponent(finalYaml)))
    document.body.innerHTML = base64
  } catch (e) {
    document.body.innerHTML = 'ERROR'
  }
})()

// ==============================
// 网页：生成链接
// ==============================
function build() {
  const url = document.getElementById('subUrl').value.trim()
  if (!url) return alert('请输入订阅地址')
  const link = `${location.origin}${location.pathname}?api=1&url=${encodeURIComponent(url)}`
  const r = document.getElementById('result')
  r.innerText = '直接复制到 Clash 使用：\n' + link
  r.style.display = 'block'
}
</script>
</body>
</html>
