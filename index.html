<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>干净订阅生成</title>
  <style>
    body{max-width:700px;margin:30px auto;padding:0 20px;font-family:system-ui;background:#f6f8fa}
    .card{background:white;padding:25px;border-radius:12px;margin-bottom:20px;box-shadow:0 1px 3px #0000001a}
    input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:10px;font-size:15px}
    button{background:#0071e3;color:white;border:none;padding:12px 20px;border-radius:8px;margin-top:15px;cursor:pointer;font-size:16px}
    .result{margin-top:20px;padding:15px;background:#f6f8fa;border-radius:8px;word-break:break-all;font-size:14px}
  </style>
</head>
<body>

<div class="card">
  <h2>干净订阅生成器</h2>
  <p>自动删除所有含「官网」的节点</p>
  <input type="text" id="subUrl" placeholder="输入原始订阅地址">
  <button onclick="createUrl()">生成干净订阅链接</button>
  <div id="result" class="result" style="display:none"></div>
</div>

<script>
// 👇 把这里改成你的 UniCloud 云函数地址
const UNICLOUD_API = "https://xxx.xxx.xxx.xxx.unicloud.net/subscribeClean";

function createUrl() {
  const url = document.getElementById("subUrl").value.trim();
  if (!url) return alert("请输入订阅地址");
  
  const final = UNICLOUD_API + "?url=" + encodeURIComponent(url);
  const res = document.getElementById("result");
  res.innerText = "✅ 干净订阅链接（已删除官网）：\n" + final;
  res.style.display = "block";
}
</script>

</body>
</html>
